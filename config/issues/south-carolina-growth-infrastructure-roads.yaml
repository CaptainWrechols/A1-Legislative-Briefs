# Phase 2 Community Conversations (Jun-Aug 2026), RAG constituent-voice dataset
# "SC1 - Phase 2 Constituent Proposals - Grid View for Legislators v2".
# FORUM PROCESS INPUT [P-xxx], not verified facts — label as such in briefs.
constituent_proposals:
  - id: local-funding-tools
    title: "New/expanded local funding tools (penny sales tax, impact fees, tolls, parking fees)"
    detail: >-
      Give local governments new or expanded funding tools for infrastructure:
      penny sales taxes, impact fees, tolls, and parking fees.
    consensus: >-
      High frequency (raised in Columbia, Florence, and Charleston). High
      consensus; transparency on how the funds are used is the key condition
      participants attached.
    tradeoffs: >-
      Transparency on use of funds is the key tradeoff participants named.
    match_terms: ["penny tax", "local option", "sales tax", "toll", "parking fee", "impact fee"]
  - id: developer-pays-growth
    title: "Make developers pay for growth (impact fees / proffers)"
    detail: >-
      Require developers to pay for the infrastructure their projects create
      demand for, through impact fees or proffers.
    consensus: >-
      Very high frequency (raised at all events). High consensus.
    tradeoffs: >-
      Pass-through to consumers (higher home prices) is the main concern.
    match_terms: ["impact fee", "proffer", "developer", "growth"]
  - id: multimodal-transport
    title: "Public transit, rail, and multimodal options beyond roads"
    detail: >-
      Invest in public transit, rail, and multimodal transportation rather
      than roads alone.
    consensus: >-
      High frequency (3 events). High consensus in cities; rural relevance
      was questioned.
    tradeoffs: >-
      Whether transit and rail investments serve rural South Carolina was the
      main open question.
    match_terms: ["transit", "rail", "multimodal", "public transportation"]
  - id: state-master-planning
    title: "State comprehensive/regional planning instead of fragmented county plans"
    detail: >-
      Move toward state-level comprehensive or regional planning for growth
      and infrastructure, in place of fragmented county-by-county plans.
    consensus: >-
      Very high frequency (all 4 events). Mixed consensus — the home-rule
      tension (local control vs. state authority) runs through it.
    tradeoffs: >-
      Home-rule tension: state planning trades away local control.
    match_terms: ["comprehensive plan", "master plan", "regional", "home rule", "county plan"]
  - id: fix-roads-first
    title: "Maintain existing roads before building new capacity"
    detail: >-
      Prioritize maintaining and repairing existing roads before spending on
      expansion.
    consensus: >-
      Medium frequency. Mixed consensus.
    tradeoffs: >-
      Maintenance vs. expansion is the core tradeoff.
    match_terms: ["maintenance", "pavement", "repair", "resurfacing"]
  - id: no-new-taxes
    title: "Oppose new taxes or fees for infrastructure"
    detail: >-
      Fund infrastructure without any new taxes or fees.
    consensus: >-
      Medium frequency. Low consensus; a sharp split among participants.
    tradeoffs: >-
      Directly conflicts with the local-funding-tools and developer-pays
      proposals; participants split sharply.
    match_terms: ["tax increase", "new tax", "fee increase", "tax relief"]
  - id: contractor-accountability
    title: "Improve the bidding process and hold contractors accountable"
    detail: >-
      Improve how road and infrastructure contracts are bid and hold
      contractors accountable for results.
    consensus: >-
      Medium frequency. High consensus; seen as a low-cost fix.
    tradeoffs: >-
      Seen as low-cost; few tradeoffs were raised.
    match_terms: ["contractor", "bidding", "procurement", "accountability"]

