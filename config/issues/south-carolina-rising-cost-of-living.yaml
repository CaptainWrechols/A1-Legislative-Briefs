# FINAL proposal grid ("SC1 - Rising Cost of Living", received 2026-09-04).
# The frequency/consensus/tradeoff cells below carry the grid's reported
# lines for this issue verbatim (the final grids carry the Phase 2 cells
# forward, per the slow-wage-growth final grid); the source document did not
# transfer into this workspace, so human reviewers should confirm against
# the original (flagged in the review report).
# FORUM PROCESS INPUT [P-xxx], not verified facts — present as such in briefs.
constituent_proposals:
  - id: utility-transparency
    title: "Greater transparency into utility rates and legislator/utility financial ties"
    detail: >-
      Open up how utility rates are set and disclose financial ties between
      legislators and utilities.
    frequency: "Medium: came up in two of four in-person events."
    consensus: >-
      High: broad agreement when discussed.
    tradeoffs: >-
      Participants broadly agreed that consumers feel like the utility
      company has all the power.
    legislator_feedback: >-
      "They already report on SEI but yes." (grid note — process input)
    match_terms: ["utility rate", "electric rate", "rate increase", "Public Service Commission", "ratepayer", "disclosure"]
  - id: utility-competition
    title: "Open the utility market / lower barriers to competition (end the monopoly)"
    detail: >-
      Allow competition in the utility market by ending monopoly service
      territories or lowering barriers to entry.
    frequency: "Medium: came up in two of four in-person events."
    consensus: >-
      Mixed: some supported the idea that a free market could lower prices,
      while others questioned the feasibility.
    tradeoffs: >-
      Some worried that a free market was impractical given the
      infrastructure requirements of running a utility.
    legislator_feedback: >-
      "Non starter especially with the merger of Dominion and Nextera."
      (grid note — process input, unverified)
    match_terms: ["monopoly", "competition", "energy market", "deregulat", "retail choice"]
  - id: financial-education
    title: "Personal budgeting and financial education"
    detail: >-
      Teach personal budgeting and financial skills so households can manage
      rising costs.
    frequency: "Low: Columbia."
    consensus: >-
      Mixed: agreement that learning financial responsibility is important
      but divergence over how to best accomplish that goal.
    tradeoffs: >-
      Concerns about how such a program should be implemented and whether it
      is the state's responsibility.
    legislator_feedback: >-
      "This is too broad? Create a subject matter to be taught in schools?
      Politicians would love this but it has to be tied to a specific
      action?" (grid note — process input)
    match_terms: ["financial literacy", "financial education", "personal finance", "budgeting"]
  - id: reduce-property-vehicle-taxes
    title: "Reduce / eliminate property and vehicle taxes"
    detail: >-
      Reduce or eliminate property taxes and vehicle taxes to lower household
      costs. (From the grid's legislator-feedback section; no Phase 2
      frequency/consensus cells.)
    consensus: >-
      From the legislator feedback grid rather than high Phase 2 frequency;
      include in matching so related bills are surfaced.
    tradeoffs: >-
      Replacing the revenue (schools and local government are funded by
      property taxes) is the core tradeoff.
    match_terms: ["property tax", "vehicle tax", "personal property tax", "millage", "tax relief", "homestead exemption"]

