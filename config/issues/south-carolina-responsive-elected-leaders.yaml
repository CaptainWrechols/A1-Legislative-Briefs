# FINAL proposal grid ("SC1 - Responsive Elected Leaders", received
# 2026-09-04) — the two proposals that advanced out of Community
# Conversations, superseding the earlier Phase 2 v2 grid's six items. The
# other four lanes (term limits, campaign finance, ranked choice voting,
# financial disclosure) did not advance as proposals; the grid's framing
# keeps them as background ("unlimited terms or other weak accountability
# mechanisms"). FORUM PROCESS INPUT, not verified facts — present as such
# in briefs.
constituent_proposals:
  - id: independent-redistricting
    title: "Independent / nonpartisan redistricting commission (anti-gerrymandering)"
    detail: >-
      Move redistricting from the legislature to an independent or
      nonpartisan commission to prevent gerrymandering.
    frequency: "High: appeared in three out of four in-person events."
    consensus: >-
      High: very strong support where the idea was discussed.
    tradeoffs: >-
      Some worried about how independent the commission would be. Others
      noted that keeping redistricting on the ten-year cycle would help.
    match_terms: ["redistricting", "reapportionment", "gerrymander", "commission", "district lines"]
  - id: voter-civics-education
    title: "Better voter education / civics and neutral civic information tools"
    detail: >-
      Improve voter education and civics instruction, and provide neutral
      civic information tools for voters.
    frequency: "Medium: appeared in Charleston and Columbia."
    consensus: >-
      High: very strong support where the idea was discussed.
    tradeoffs: >-
      Some participants were worried about how neutral information would be
      selected and disseminated.
    match_terms: ["civics", "voter education", "voter guide", "civic education"]

