# NELIS full-text search terms. Every NELIS hit is kept and tagged with the
# terms that found it; the relevance filter is only a review flag. The LCB
# Subject Index harvest (pass1_subject_index.py) carries the bulk of
# discovery for this issue: the K-12 heading family (EDUCATION, SCHOOL
# PUPILS, SCHOOL PERSONNEL, SCHOOL FINANCES AND FUNDS, SCHOOLS PUBLIC/
# CHARTER, SUPERINTENDENT OF PUBLIC INSTRUCTION, ...) is far larger than the
# water or housing families, so keyword terms here stay proposal-focused.
search_terms:
  # Core K-12 vocabulary (Nevada statute says "pupil", not "student")
  - pupil
  - teacher
  - "public schools"
  - "school district"
  - "charter school"
  # Funding and classroom spending (proposals 1 and 2)
  - "per pupil"
  - "pupil-centered funding"
  - "State Education Fund"
  - "education funding"
  - "inspector general"
  # Recess and guaranteed instructional minutes (proposal 3)
  - recess
  - "physical education"
  - "instructional time"
  # Classroom technology (proposal 4)
  - "educational technology"
  # Pre-K and early childhood (proposal 5)
  - kindergarten
  - prekindergarten
  - "early childhood"
  # Administrators and superintendents (proposal 6)
  - superintendent
  # Teacher pay, shortage, class size (proposal 7)
  - "class size"
  - "teacher salaries"
  # Assessment and growth measurement (proposal 8)
  - "achievement of pupils"
  - "college and career readiness"
  # Read by Grade 3 (proposal 9)
  - "read by grade"
  - literacy
  # School-based mental health and integrated supports (proposal 10)
  - "school counselor"
  - "school social worker"
  - "school psychologist"
  - "school-based"
  - "safe-to-tell"

# Words that mark a title/digest as clearly on-topic (review flag only;
