# New Hampshire issue config — Energy Cost, Sourcing, and Reliability
# Built from config/issues/new-hampshire-public-education.yaml (the newest NH
# issue) with search/relevance terms fitted to the energy vocabulary
# (2026-08-12). Sessions 2020 -> current only.
#
# Select with: export ISSUE_CONFIG=config/issues/new-hampshire-energy.yaml

state: new-hampshire
issue_id: new-hampshire-04-energy
issue_title: "Energy Cost, Sourcing, and Reliability in New Hampshire"
issue_slug: energy
openstates_jurisdiction: New Hampshire

# NH runs annual sessions inside two-year biennia; budget years (HB1 operating
# budget + HB2 policy trailer) are 2021, 2023, 2025.
sessions:
  - {label: "2020", openstates_identifier: "2020", sql_session_year: 2020, biennium: "2019-2020", budget: false}
  - {label: "2021", openstates_identifier: "2021", sql_session_year: 2021, biennium: "2021-2022", budget: true}
  - {label: "2022", openstates_identifier: "2022", sql_session_year: 2022, biennium: "2021-2022", budget: false}
  - {label: "2023", openstates_identifier: "2023", sql_session_year: 2023, biennium: "2023-2024", budget: true}
  - {label: "2024", openstates_identifier: "2024", sql_session_year: 2024, biennium: "2023-2024", budget: false}
  - {label: "2025", openstates_identifier: "2025", sql_session_year: 2025, biennium: "2025-2026", budget: true}
  - {label: "2026", openstates_identifier: "2026", sql_session_year: 2026, biennium: "2025-2026", budget: false}

# Full-text search terms used to discover bills (SQL LIKE '%term%' over titles;
# OpenStates bulk titles+abstracts for 2020-2024). High recall; every hit is
# kept for human review in curation.
#
# Volume calibration (working/new-hampshire/energy/calibrate-terms.py, run over
# the 2020-2024 bulk CSVs AND the 2025-2026 SQL legislation table before this
# list was frozen):
#   * Unlike the education packet (where bare "school"/"education" swept 1,275
#     bills), the bare high-value words ARE affordable here: "energy" sweeps
#     176 bills, "electric" 140, "utility" 46, "utilities" 37. They also
#     subsume most compound phrases ("renewable energy", "energy efficiency",
#     "energy storage", "department of energy", "electricity", "electrical",
#     "electric vehicle", "electric grid", "net energy metering" via "energy").
#   * The frozen 46-term list unions to 453 bills (318 in the 2020-2024 bulk
#     mirror + 135 in the 2025-2026 SQL table) — half the education load.
#
# Substring-safety adjustments (SQL LIKE matches substrings) — every trap
# below was measured and its uncovered hits hand-inspected:
#   * "power" is a trap (50 hits; powers and duties, power of attorney,
#     emergency powers, powerboats). The real energy bills it hides are
#     rescued by "power line" (HB1331 2022), "power generation" (the
#     assessing-power-generation study bills SB225/HB458 and successors),
#     and "biopower" (the Burgess BioPower bills SB271 2022 / HB142 2023).
#   * "rate" is a trap (182 hits; minimum hourly rate, tax rates, Medicaid
#     reimbursement). Its only uncovered energy bills are rescued by
#     "pole attachment" (SB595 2024) and "time-of-use" (HB674 2025).
#   * "wind" is a trap (windows, windshields, Windsor); every real wind bill
#     carries "offshore wind" or "renewable"/"energy" vocabulary — verified,
#     zero uncovered wind-energy bills.
#   * "oil" is a trap (soil, toilet); "heating oil" and "oil discharge"
#     rescue the fuel-side bills (HB1395 2024, HB658 2025, HB1620 2026).
#   * "gas" is a trap (tear gas); "natural gas" and "greenhouse gas" (RGGI
#     cap-and-trade, climate action plan bills) carry the real thread.
#   * "meter" is a trap (cemetery, perimeter); "smart meter" and the
#     metering compounds carry it (HB1743 2026 smart-meter radiation).
#   * "fuel" alone is cheap (12 hits) but "heating fuel", "fuel assistance",
#     "fossil fuel", and "low carbon fuel" carry every real hit without the
#     noise; "ethanol" rescues the fuel-blend retail bill (HB454 2026).
#   * "solar" (22) and "grid" (15, subsumes "microgrid") are safe — verified.
#   * "carbon" (19), "emission" (19), and "climate" (22) are kept: they carry
#     carbon pricing, section-177 vehicle-emissions, TCI, and climate-plan
#     bills; their forestry/school-climate noise is pruned in curation with
#     recorded exclusion categories.
#   * "coal" is omitted — its only hits are coal grading, coal-tar sealants,
#     "rolling coal", and the Coalition Against Sexual and Domestic Violence;
#     NH has no coal legislation in either universe (re-checked word-bounded
#     in both certifications).
#   * "community power" and "geothermal" score zero in both universes (NH
#     community-power bills say "aggregation of electric customers"); kept as
#     search terms anyway — they are free, and they document the vocabulary.
#   * "peak demand", "kilowatt", "megawatt", "hydropower", "energy code",
#     "boiler", "furnace", "kerosene" score zero and are omitted.
search_terms:
  - "energy"
  - "electric"
