# HB2 is New Hampshire's omnibus budget policy trailer; it must be analysed
# section-by-section (see docs/nh-hb2-section-workflow.md). Votes are recorded
# on HB2 as a whole, never per section. For this issue HB2 carries major
# structural policy: the 2021 trailer created the Department of Energy
# (91:187), authorized electric rate reduction bonds (91:98), rewrote PUC
# assessments (91:243-263), amended restructuring principles (91:281), and
# set offshore-wind study direction (91:201); the 2023 trailer reworked PUC
# assessment mechanics (79:119/122) and EV-registration fees (79:474-475);
# the 2025 trailer carried the energy and aggregation sections the education
# packet excluded. The property-taxes and public-education HB2 analyses both
# EXCLUDED these sections with documented reasons — their EXCLUDED dicts are
# the candidate map this issue re-curates as core.
omnibus_bills:
  - bill_no: HB2
    role: "budget policy trailer (companion to HB1)"
    cycles: [2021, 2023, 2025]
    method: section-by-section
    section_extractor: collectors/nh/hb2_sections.py
    outputs:
      sections_json: "working/new-hampshire/{issue}/hb2-sections.json"
      sections_md: "working/new-hampshire/{issue}/hb2-sections.md"
      relevant_json: "working/new-hampshire/{issue}/hb2-relevant.json"
    # RSA chapters this issue is known to live in; used alongside
    # relevance_terms when hand-reviewing HB2 section matches. Every chapter
    # below was verified against the GenCourt RSA index before freezing.
    affected_rsa_chapters:
      - "12-P"    # Department of Energy
      - "38"      # Municipal Electric, Gas, or Water Systems
      - "53-E"    # Aggregation of Electric Customers by Municipalities and Counties (community power)
      - "125-O"   # Multiple Pollutant Reduction Program (RGGI, 125-O:19 et seq.)
      - "162-H"   # Energy Facility Evaluation, Siting, Construction and Operation (site evaluation committee)
      - "362"     # Definition of Terms; Utilities Exempted
      - "362-A"   # Limited Electrical Energy Producers Act (net energy metering)
      - "362-F"   # Electric Renewable Portfolio Standard
      - "363"     # The Public Utilities Commission
      - "369-B"   # Electric Rate Reduction Financing and Commission Action (rate reduction bonds)
      - "374"     # General Regulations (public utilities)
      - "374-F"   # Electric Utility Restructuring
      - "374-G"   # Electric Utility Investment in Distributed Energy Resources
      - "378"     # Rates and Charges

# Phase 2 Community Conversation proposals (June-July 2026), from the
# "NH1 - Phase 2 Constituent Proposals - Grid View for Legislators" packet
# (Energy Cost, Sourcing, and Reliability grid, editable revision of
# 2026-08-12). These are the organizing spine of the proposal spotlights.
# This grid section carries no star markers (legislature_addressed) —
# unlike the education grid, no proposal here is flagged as already
# addressed by the legislature.
constituent_proposals:
  - id: expand-renewable-energy
    title: "Prioritize / expand renewable energy (solar, wind, geothermal, diversified sources)"
    legislature_addressed: false
    frequency: "Very High: Appeared in Nashua, Concord and online conversations."
    notes: >-
      Very limited pushback, but some concerns around cost of a renewable
      build-out.
    outcome: >-
      High: Participants agreed that renewables offer cheaper and greener
      power for NH.
    match_terms: ["renewable", "renewable energy", "renewable portfolio", "solar", "offshore wind", "wind energy", "geothermal", "hydroelectric", "biomass", "nuclear", "clean energy", "net metering", "net energy metering", "362-F"]
  - id: fund-nh-saves-weatherization
    title: "Fund / strengthen NH Saves weatherization & efficiency programs (including on-bill financing)"
    legislature_addressed: false
    frequency: "Very High: Appeared in Nashua, Concord and online conversations."
    notes: >-
      The program has a limited scope and has faced some political
      opposition. One participant argues that their tax dollars should not
      pay to improve someone else's home.
    outcome: >-
      High: Most participants agree that the program is effective and should
      be funded.
    match_terms: ["energy efficiency", "weatherization", "system benefits charge", "NHSaves", "NH Saves", "on-bill", "energy conservation", "fuel assistance", "greenhouse gas"]
  - id: eversource-puc-accountability
    title: "Greater transparency / accountability for Eversource; better regulation of the PUC"
    legislature_addressed: false
    frequency: "Medium-low: Was brought up in Nashua."
    notes: >-
      Concerns about political viability with one participant noted
      resistance from conservatives to further regulation.
    outcome: >-
      Broad agreement that the PUC needs more transparency, but some
      divergence on how heavily to regulate.
    match_terms: ["public utilities commission", "Eversource", "ratepayer", "electric rate", "default service", "consumer advocate", "electric distribution", "utility", "363", "374-F"]
  - id: local-renewables-grid-infrastructure
    title: "Incentivize renewables for cities, towns, and individuals and strengthen supporting grid infrastructure"
    legislature_addressed: false
    frequency: "Medium: Nashua, multiple tables"
    notes: >-
      Transmission is a limiting factor and the infrastructure is slow and
      expensive to build
    outcome: >-
      High: Adopted as a final recommendation when tied to improving
      transmission infrastructure
    match_terms: ["community power", "aggregation", "net metering", "net energy metering", "transmission", "grid", "microgrid", "distributed energy", "energy storage", "power line", "pole attachment", "53-E", "374-G"]
  - id: time-of-use-rates
    title: "Adopt time-of-use / variable-price electricity rates"
    legislature_addressed: false
    frequency: "Medium-low: Was brought up in Concord."
    notes: >-
      Concerns about political viability. Roll-out of smart meters is slow
    outcome: >-
      High: Endorsed in Concord as a mechanism to keep cost down
    match_terms: ["time-of-use", "smart meter", "peak demand", "electric rate", "rate design", "non-wire alternatives", "multi-year rate", "advanced metering"]

# Relevant NH RSA chapters for background/context.
rsa_chapters: ["12-P", "38", "53-E", "125-O", "162-H", "362", "362-A", "362-F", "363", "369-B", "374", "374-F", "374-G", "378"]

