# New Hampshire issue config — Public Education
# Built from config/issues/new-hampshire-property-taxes.yaml (the newest NH
# issue) with search/relevance terms fitted to the K-12 public-education
# vocabulary (2026-08-12). Sessions 2020 -> current only.
#
# Select with: export ISSUE_CONFIG=config/issues/new-hampshire-public-education.yaml

state: new-hampshire
issue_id: new-hampshire-03-public-education
issue_title: "Public Education in New Hampshire"
issue_slug: public-education
openstates_jurisdiction: New Hampshire

# NH runs annual sessions inside two-year biennia; budget years (HB1 operating
# budget + HB2 policy trailer) are 2021, 2023, 2025.
sessions:
  - {label: "2020", openstates_identifier: "2020", sql_session_year: 2020, biennium: "2019-2020", budget: false}
  - {label: "2021", openstates_identifier: "2021", sql_session_year: 2021, biennium: "2021-2022", budget: true}
  - {label: "2022", openstates_identifier: "2022", sql_session_year: 2022, biennium: "2021-2022", budget: false}
  - {label: "2023", openstates_identifier: "2023", sql_session_year: 2023, biennium: "2023-2024", budget: true}
  - {label: "2024", openstates_identifier: "2024", sql_session_year: 2024, biennium: "2023-2024", budget: false}
  - {label: "2025", openstates_identifier: "2025", sql_session_year: 2025, biennium: "2025-2026", budget: true}
  - {label: "2026", openstates_identifier: "2026", sql_session_year: 2026, biennium: "2025-2026", budget: false}

# Full-text search terms used to discover bills (SQL LIKE '%term%' over titles;
# OpenStates bulk titles+abstracts for 2020-2024). High recall; every hit is
# kept for human review in curation.
#
# Volume calibration (working/new-hampshire/public-education/calibrate-terms.py,
# run over the 2020-2024 bulk CSVs AND the 2025-2026 SQL legislation table
# before this list was frozen):
#   * bare "education" sweeps 479 bills and bare "school" 533 — together the
#     union with the other traps is 1,275 bills; neither is a term here. The
#     compound phrases below carry the vocabulary (union ~850 bills), and the
#     universe certifications re-sweep with the bare words under human review
#     so nothing real is lost.
#
# Substring-safety adjustments (SQL LIKE matches substrings):
#   * "assessment" is NOT a term — in THIS packet "statewide assessment" is
#     education testing (RSA 193-C), but bare "assessment" (61 hits) is
#     dominated by property-tax assessment and assessment of damages. This is
#     the reverse of the property-taxes packet, which excluded "assessment"
#     because it meant testing there; "statewide assessment" carries the
#     testing thread here.
#   * "school" is inside "schooling" and "preschool"; bare "school" is a trap
#     (533 hits) — the compound school phrases below carry it.
#   * "board" alone is a trap (223 hits — licensing boards, bank board);
#     "school board" and "state board of education" carry it.
#   * "suspension" is a trap (drivers'-license suspensions); pupil-discipline
#     bills carry "pupil"/"school" vocabulary instead.
#   * "scholarship" alone is half child-care scholarship bills; "scholarship
#     organization" + "education tax credit" carry the K-12 tax-credit
#     scholarship thread.
#   * "parental rights" alone is family-custody law ("parental rights and
#     responsibilities"); "parental bill of rights" / "parents' bill of
#     rights" carry the education thread (HB1431 2022, SB272 2023).
#   * "kindergarten" subsumes "pre-kindergarten"; "learning" subsumes
#     "remote learning"/"extended learning"; "instruction" subsumes
#     "instructional"; "freedom account" also catches the "educational
#     freedom accounts" spelling that "education freedom" misses.
#   * "recess" (legislative recess), "academy" (police academy), "college" /
#     "university" (higher ed, out of K-12 scope) omitted.
search_terms:
