# HB2 is New Hampshire's omnibus budget policy trailer; it must be analysed
# section-by-section (see docs/nh-hb2-section-workflow.md). Votes are recorded
# on HB2 as a whole, never per section. For this issue HB2 carries both the
# money AND the policy: the 2021 trailer created education freedom accounts;
# the 2023 trailer rewrote the adequacy formula numbers; the 2025 trailer
# removed the EFA income cap, added the anti-DEI education provisions, and
# rewrote special-education rate mechanics.
omnibus_bills:
  - bill_no: HB2
    role: "budget policy trailer (companion to HB1)"
    cycles: [2021, 2023, 2025]
    method: section-by-section
    section_extractor: collectors/nh/hb2_sections.py
    outputs:
      sections_json: "working/new-hampshire/{issue}/hb2-sections.json"
      sections_md: "working/new-hampshire/{issue}/hb2-sections.md"
      relevant_json: "working/new-hampshire/{issue}/hb2-relevant.json"
    # RSA chapters this issue is known to live in; used alongside
    # relevance_terms when hand-reviewing HB2 section matches.
    affected_rsa_chapters:
      - "21-N"    # Department of Education
      - "186"     # State Board of Education
      - "186-C"   # Special Education
      - "188-E"   # Regional Career and Technical Education
      - "189"     # School Boards, Superintendents, Teachers, and Truant Officers
      - "190"     # Council for Teacher Education
      - "193"     # Pupils (attendance, safety, discipline)
      - "193-A"   # Home Education
      - "193-C"   # Statewide Education Improvement and Assessment Program
      - "193-E"   # Adequate Public Education
      - "194"     # School Districts
      - "194-B"   # Chartered Public Schools
      - "194-F"   # Education Freedom Accounts
      - "195"     # Cooperative School Districts
      - "198"     # School Money (education trust fund, adequacy grants, SWEPT)

# Phase 2 Community Conversation proposals (June-July 2026), from the
# "NH1 - Phase 2 Constituent Proposals - Grid View for Legislators" packet
# (K-12 Public Education Outcomes grid, editable revision of 2026-08-12).
# These are the organizing spine of the proposal spotlights. The grid marks
# three proposals (legislature_addressed: true) with its star ("issues that
# have been addressed by the legislature in recent years").
constituent_proposals:
  - id: increase-state-funding-swept
    title: "Increase state funding / SWEPT / distribution of funds to high-need districts"
    legislature_addressed: true
    frequency: "Very High: Nashua, Concord, and online conversations."
    notes: >-
      Education funding and its impact on property taxes dominated education
      discussions. There was much discussion about where the money comes from
      and whether schools need to adjust spending.
    outcome: >-
      There was no broad agreement on how to move forward.
    match_terms: ["adequate education", "adequacy", "statewide education", "education trust fund", "school funding", "education funding", "swept", "extraordinary need", "fiscal capacity", "school building aid", "state aid", "per pupil"]
  - id: diversify-revenue-sources
    title: "Diversify state revenue sources (income tax, business taxes, interest & dividends and other revenue)"
    legislature_addressed: false
    frequency: "High: Nashua, Concord, and online conversations."
    notes: >-
      Increasing revenue to offset property taxes had broader appeal. Concerns
      were raised whether schools need to adjust spending.
    outcome: >-
      High agreement that it is an issue but no consensus on how to solve.
    match_terms: ["income tax", "sales tax", "interest and dividends", "business profits", "business enterprise", "education trust fund", "revenue"]
  - id: better-measures-student-success
    title: "Identify better measures of student success"
    legislature_addressed: true
    frequency: "High: Nashua and Concord"
    notes: >-
      A recurring non-funding proposal was to change how outcomes are
      measured, shifting from standardized test scores toward a different
      metric.
    outcome: >-
      There was broad agreement that current tests are inadequate.
      Participants did not have time to discuss proposed solutions.
    match_terms: ["statewide assessment", "competency", "proficiency", "accountability", "performance", "graduation", "credential", "193-C"]
  - id: special-education-cost-commission
    title: "Create a commission to study special education costs"
    legislature_addressed: true
    frequency: "High: Nashua, Concord, and online conversations."
    notes: >-
      Participants in all sessions recognized that increases in special
      education costs are impacting property taxes.
    outcome: >-
      There was agreement that understanding what is driving the increased
      cost is important before proposing solutions.
    match_terms: ["special education", "186-C", "IEP", "catastrophic aid", "individualized education"]
  - id: career-pathways-business-partnerships
    title: "Offer more career pathways and opportunities to partner with businesses"
    legislature_addressed: false
    frequency: "Medium: Appeared in both Nashua and Concord."
    notes: >-
      Participants discussed the importance of critical thinking and
      preparing students for all types of careers, not just college.
    outcome: >-
      A broad agreement that not every student has to go to college and k-12
      schools need to serve a variety of career paths. Participants did not
      have time to discuss proposed solutions.
    match_terms: ["career and technical", "vocational", "apprenticeship", "workforce development", "career pathways", "extended learning", "work-based", "internship"]
  - id: technology-in-schools
    title: "Review the use of technology in school"
    legislature_addressed: false
    frequency: "Medium: Appeared in both Nashua and Concord."
    notes: >-
      Participants shared concerns about the use of screen time, especially
      in the earlier grades.
    outcome: >-
      The use of screen time and access to technology was discussed in both
      community conversations. Participants did not have time to discuss
      proposed solutions.
    match_terms: ["technology", "computer science", "internet", "screen", "cell phone", "personal electronic", "device", "media literacy", "artificial intelligence"]

