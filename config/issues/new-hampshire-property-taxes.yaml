# HB2 is New Hampshire's omnibus budget policy trailer; it must be analysed
# section-by-section (see docs/nh-hb2-section-workflow.md). Votes are recorded
# on HB2 as a whole, never per section. For this issue HB2 is where the big
# rate changes live: the 2021 trailer cut the BPT, BET, and meals-and-rooms
# rates and began the interest-and-dividends phase-out; the 2023 trailer
# accelerated the I&D repeal and rewrote education funding numbers.
omnibus_bills:
  - bill_no: HB2
    role: "budget policy trailer (companion to HB1)"
    cycles: [2021, 2023, 2025]
    method: section-by-section
    section_extractor: collectors/nh/hb2_sections.py
    outputs:
      sections_json: "working/new-hampshire/{issue}/hb2-sections.json"
      sections_md: "working/new-hampshire/{issue}/hb2-sections.md"
      relevant_json: "working/new-hampshire/{issue}/hb2-relevant.json"
    # RSA chapters this issue is known to live in; used alongside
    # relevance_terms when hand-reviewing HB2 section matches.
    affected_rsa_chapters:
      - "21-J"    # Department of Revenue Administration
      - "72"      # Persons and property liable to taxation (exemptions, credits)
      - "74"      # Annual inventory of polls and taxable property
      - "75"      # Appraisal of taxable property
      - "76"      # Apportionment, assessment, and abatement of taxes (incl. education tax)
      - "77"      # Interest and dividends tax
      - "77-A"    # Business profits tax
      - "77-E"    # Business enterprise tax
      - "78-A"    # Meals and rooms tax
      - "79"      # Forest conservation and taxation (timber tax)
      - "79-A"    # Current use taxation (incl. land use change tax)
      - "83-F"    # Utility property tax
      - "193-E"   # Adequate public education
      - "198"     # School money (education trust fund, adequacy grants, SWEPT mechanics)

# Phase 2 Community Conversation proposals (June-July 2026), from the
# "NH1 - Phase 2 Constituent Proposals - Grid View for Legislators" packet
# (Property Taxes and Revenue Needs grid, editable .docx revision of
# 2026-08-11). These are the organizing spine of the proposal spotlights.
constituent_proposals:
  - id: restore-interest-dividends-tax
    title: "Restore the interest and dividends tax"
    frequency: "High: Appeared in both Nashua and Concord."
    notes: >-
      Concerns about political possibility since it involves raising taxes on
      the wealthy.
    outcome: >-
      High: Broad agreement that NH tax base needs to be tied to a stable
      revenue source. Broad support for dividends tax, with only a few
      detractors.
    match_terms: ["interest and dividends", "dividends tax"]
  - id: diversify-tax-base
    title: "Diversify the tax base / add new revenue sources"
    frequency: "Very High: Nashua, Concord and online conversations"
    notes: >-
      Heavy resistance to broad-based sales or income tax. More openness to
      increasing excise tax.
    outcome: >-
      Agreement that expanding the tax base should be a topic of discussion
      but little consensus on what taxes should actually be implemented.
    match_terms: ["income tax", "sales tax", "excise", "keno", "lottery", "gambling", "local option", "new revenue"]
  - id: restore-business-taxes
    title: "Stop cutting / restore state business taxes (BET, BPT, rooms & meals)"
    frequency: "Very High: Nashua, Concord and online conversations."
    notes: >-
      Concerns about what raising business taxes will do for growth. On the
      other side, participants argued that cutting business taxes have hurt
      towns and forced the state to rely more heavily on property tax.
    outcome: >-
      High: Broad agreement that NH needs to stop "bleeding revenue."
    match_terms: ["business profits", "business enterprise tax", "meals and rooms", "tax rate", "revenue sharing"]
  - id: homestead-exemption
    title: "Homestead exemption"
    frequency: "High: Concord and online conversations."
    notes: >-
      Uncertainty about the impact on renters and how the tax change could
      impact home prices.
    outcome: >-
      High: Some agreement paired with uncertainty. Most participants thought
      that second home should be taxed higher but broad impacts are unclear.
    match_terms: ["homestead", "second home", "owner-occupied", "primary residence", "tax exemption"]
  - id: regionalization-consolidation
    title: "Increase regionalization / consolidate services"
    frequency: "Medium: Concord, multiple tables"
    notes: >-
      Concerns about not wanting to remove local control and that
      consolidation could lead to degraded services.
    outcome: >-
      Mixed: Most participants agreed the consolidation could lead to saving
      but some worried that trade offs would not be worth it.
    match_terms: ["cooperative school", "consolidat", "regionaliz", "shared services", "county"]
  - id: legislator-communication
    title: "Improve communication and public education by legislators"
    frequency: "Medium: Nashua, multiple tables"
    notes: >-
      Participants voiced concerns that politicians will not be open and
      honest with the public.
    outcome: >-
      High: Adopted as a formal recommendation. Residents want open and honest
      communication from politicians around the property tax debate.
    match_terms: ["taxpayer information", "tax expenditure report", "transparency", "right-to-know", "public education"]

# Relevant NH RSA chapters for background/context.
rsa_chapters: ["21-J", "72", "74", "75", "76", "77", "77-A", "77-E", "78-A", "79", "79-A", "83-F", "193-E", "198"]

agency_document_urls: []

impact_lookback_years: 20
