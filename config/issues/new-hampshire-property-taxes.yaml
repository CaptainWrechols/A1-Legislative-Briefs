# New Hampshire issue config — Property Taxes and Revenue Needs
# Built from config/issues/new-hampshire-housing-affordability.yaml (the
# template issue) with search/relevance terms fitted to the property-tax /
# state-revenue vocabulary (2026-08-11). Sessions 2020 -> current only.
#
# Select with: export ISSUE_CONFIG=config/issues/new-hampshire-property-taxes.yaml

state: new-hampshire
issue_id: new-hampshire-02-property-taxes
issue_title: "Property Taxes and Revenue Needs in New Hampshire"
issue_slug: property-taxes
openstates_jurisdiction: New Hampshire

# NH runs annual sessions inside two-year biennia; budget years (HB1 operating
# budget + HB2 policy trailer) are 2021, 2023, 2025.
sessions:
  - {label: "2020", openstates_identifier: "2020", sql_session_year: 2020, biennium: "2019-2020", budget: false}
  - {label: "2021", openstates_identifier: "2021", sql_session_year: 2021, biennium: "2021-2022", budget: true}
  - {label: "2022", openstates_identifier: "2022", sql_session_year: 2022, biennium: "2021-2022", budget: false}
  - {label: "2023", openstates_identifier: "2023", sql_session_year: 2023, biennium: "2023-2024", budget: true}
  - {label: "2024", openstates_identifier: "2024", sql_session_year: 2024, biennium: "2023-2024", budget: false}
  - {label: "2025", openstates_identifier: "2025", sql_session_year: 2025, biennium: "2025-2026", budget: true}
  - {label: "2026", openstates_identifier: "2026", sql_session_year: 2026, biennium: "2025-2026", budget: false}

# Full-text search terms used to discover bills (SQL LIKE '%term%' over titles;
# OpenStates bulk titles+abstracts for 2020-2024). High recall; every hit is
# kept for human review in curation.
#
# Substring-safety adjustments (SQL LIKE matches substrings):
#   * bare "tax" is deliberately NOT a term - it would sweep 600+ bills a
#     biennium (every excise, fee, and "taxidermy") and drown curation; the
#     specific tax phrases below plus the certification wide net cover it.
#   * "assessment" is NOT a term ("statewide assessment" is education testing,
#     "assessment of damages" is tort law); "assessing" / "revaluation" /
#     "equalization" carry the property-assessment vocabulary.
#   * "rooms and meals" is omitted: the statutory phrase in titles is
#     "meals and rooms" (RSA 78-A) - zero titles use the reversed order.
#   * "homestead" also matches "homestead food operation" (cottage-food
#     licensing); those are curated out as context.
#   * "retirement system contributions" (not bare "retirement system", 70+
#     bills of pension mechanics) catches the state-share downshift thread
#     that towns pay through property taxes.
search_terms:
  - "property tax"
  - "statewide education"
  - "adequate education"
  - "adequacy"
  - "education trust fund"
  - "school funding"
  - "education funding"
  - "school building aid"
  - "interest and dividends"
  - "business profits"
  - "business enterprise tax"
  - "meals and rooms"
  - "homestead"
  - "current use"
  - "land use change tax"
  - "timber tax"
  - "excavation tax"
  - "utility property"
  - "assessing"
  - "revaluation"
  - "equalization"
  - "abatement"
  - "tax cap"
  - "tax rate"
  - "tax relief"
  - "tax exemption"
  - "tax credit"
  - "tax deferral"
  - "tax lien"
  - "tax expenditure"
  - "income tax"
  - "sales tax"
  - "excise"
  - "taxation"
  - "tax on"
  - "revenue"
  - "local option"
  - "state aid"
  - "payment in lieu of taxes"
  - "communications services tax"
  - "retirement system contributions"
  - "cooperative school"
  - "keno"
  - "lottery"
  - "gambling"

