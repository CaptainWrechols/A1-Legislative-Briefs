# Phase 2 Community Conversations (Jun-Aug 2026), RAG constituent-voice dataset
# "SC1 - Phase 2 Constituent Proposals - Grid View for Legislators v2".
# FORUM PROCESS INPUT [P-xxx], not verified facts — label as such in briefs.
constituent_proposals:
  - id: age-bracketed-minimum-wage
    title: "Age-bracketed minimum wage with a separate youth wage"
    detail: >-
      Set a minimum wage that is bracketed by age: a higher wage for adult
      workers (18+) and a separate, lower youth wage for teen workers.
    consensus: >-
      High frequency (3 events). High consensus for a higher wage for adults
      versus teen workers.
    tradeoffs: >-
      Where to draw the age line and whether a youth wage displaces adult
      workers.
    match_terms: ["youth wage", "training wage", "minimum wage", "age", "teen"]
  - id: workforce-development
    title: "Apprenticeships, career pathways, and technical training"
    detail: >-
      Expand apprenticeships, career pathways, and technical-college training
      so workers can move into higher-paying jobs.
    consensus: >-
      Medium frequency (Greenville, Columbia). High consensus.
    tradeoffs: >-
      Few tradeoffs raised; funding and employer participation are the
      practical questions.
    match_terms: ["apprentice", "career pathway", "technical college", "workforce development", "job training"]
  - id: raise-minimum-wage
    title: "Raise the minimum wage / livable wage"
    detail: >-
      Raise the state minimum wage toward a livable wage.
    consensus: >-
      High frequency (3 events). Mixed consensus; small-business concerns.
    tradeoffs: >-
      Small-business cost concerns were the main counterpoint.
    match_terms: ["minimum wage", "living wage", "livable wage", "base wage"]
  - id: employer-living-wage-incentives
    title: "Government incentives/bonuses for employers paying a living wage"
    detail: >-
      Offer government incentives or bonuses to employers who pay a living
      wage.
    consensus: >-
      Medium frequency. Mixed; the funding mechanism was disputed.
    tradeoffs: >-
      How to fund the incentives was disputed.
    match_terms: ["incentive", "tax credit", "living wage", "employer", "bonus"]

