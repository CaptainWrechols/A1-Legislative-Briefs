# FINAL proposal grid ("SC1 - Slow Wage Growth", received 2026-09-04) — the
# three proposals that advanced out of Community Conversations. The earlier
# Phase 2 standalone raise-minimum-wage item is folded into the age-bracketed
# proposal (its consensus line covers raising the adult minimum wage).
# FORUM PROCESS INPUT, not verified facts — present as such in briefs.
constituent_proposals:
  - id: age-bracketed-minimum-wage
    title: "Age-bracketed minimum wage with a separate youth wage"
    detail: >-
      Raise the minimum wage for workers over 18 so independent adults can
      earn more than teenagers with an after-school job, with a separate
      youth wage for teen workers.
    frequency: "High: came up in three of four in-person events."
    consensus: >-
      High: participants agreed that the state could raise the minimum wage
      for workers over 18. This would allow independent adults to earn more
      than teenagers with an after-school job.
    tradeoffs: >-
      Could limit upward mobility of younger South Carolinians.
    match_terms: ["youth wage", "training wage", "minimum wage", "living wage", "livable wage", "age", "teen"]
  - id: workforce-development
    title: "Workforce development: apprenticeships, career pathways, and technical training"
    detail: >-
      Expand apprenticeships, career pathways, and technical-college training
      so workers can move into higher-paying jobs.
    frequency: "Medium: appeared in Greenville and Columbia."
    consensus: >-
      High: strong agreement that such programs could help people land
      better, higher-paying jobs.
    tradeoffs: >-
      Concerns that the programs mostly helped large businesses like Boeing
      and BMW, and that there was little awareness of such programs.
    match_terms: ["apprentice", "career pathway", "technical college", "workforce development", "job training"]
  - id: employer-living-wage-incentives
    title: "Government incentives / bonuses for employers who pay a living wage"
    detail: >-
      Offer government incentives or bonuses to employers who pay a living
      wage.
    frequency: "Medium: came up in two of four in-person events."
    consensus: >-
      Mixed: agreement that employers should be incentivized to pay a living
      wage, but some divergence on funding and implementation.
    tradeoffs: >-
      Where the money will come from; some disagreement about whether
      employers should get a tax credit or direct bonuses from the state.
    match_terms: ["incentive", "tax credit", "living wage", "employer", "bonus"]

